<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Form</title>
</head>
<body>
<form th:action="@{/payments/save}" th:object="${payment}" method="post">
    <input type="number" th:field="*{orderId}" placeholder="Order ID"/>
    <input type="datetime-local" th:field="*{paymentDate}" placeholder="Payment Date"/>
    <input type="number" step="0.01" th:field="*{amount}" placeholder="Amount"/>
    <input type="text" th:field="*{method}" placeholder="Method"/>
    <button type="submit">Add Payment</button>
</form>
</body>
</html>
