server:
  port: 9001

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:movieuser}
    password: ${SPRING_DATASOURCE_PASSWORD:moviepass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect   # ⭐ QUAN TRỌNG
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

jwt:
  secret: ${JWT_SECRET:mySecretKey12345678901234567890AB}
  expiration: 86400000

logging:
  level:
    com.movieticket: DEBUG