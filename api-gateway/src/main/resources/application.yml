server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:9001}
          predicates:
            - Path=/api/users/**

        - id: movie-service
          uri: ${MOVIE_SERVICE_URL:http://localhost:9002}
          predicates:
            - Path=/api/movies/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:9003}
          predicates:
            - Path=/api/bookings/**
