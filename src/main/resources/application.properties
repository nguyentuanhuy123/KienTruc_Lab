# =============================================
# APPLICATION CONFIG - Space-Based Architecture
# =============================================
spring.application.name=space-based-architecture
server.port=8087

# =============================================
# REDIS CONFIG (RED'S - In-Memory Data Grid)
# Cài Redis th? công: https://redis.io/download
# Windows: https://github.com/microsoftarchive/redis/releases
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
# spring.data.redis.password=yourpassword  # b? comment n?u có password

# =============================================
# DATABASE CONFIG (MariaDB)
# =============================================
# ??i "spacedb" thành tên database c?a b?n.
# tham s? createDatabaseIfNotExist=true s? t? t?o DB n?u ch?a có.
spring.datasource.url=jdbc:mariadb://localhost:3306/spacedb?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123

# C?u hình JPA/Hibernate cho MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =============================================
# ASYNC / MESSAGE GRID CONFIG
# =============================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=MessageGrid-

# =============================================
# LOGGING
# =============================================
logging.level.com.spacebased=DEBUG
logging.level.org.springframework.data.redis=INFO